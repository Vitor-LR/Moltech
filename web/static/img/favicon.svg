<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64">
  <!-- Moltech: três órbitas e um núcleo. Nos navegadores que animam SVG no ícone, os elétrons giram. -->
  <g fill="none" stroke="#1552C8" stroke-width="3">
    <ellipse rx="28" ry="10.5"/>
    <ellipse rx="28" ry="10.5" transform="rotate(60)"/>
    <ellipse rx="28" ry="10.5" transform="rotate(120)"/>
  </g>
  <circle r="6" fill="#C2410C"/>
  <g fill="#0F1B26" stroke="#fff" stroke-width="1">
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M-28,0a28,10.5 0 1,0 56,0a28,10.5 0 1,0 -56,0"/></circle>
    <g transform="rotate(60)"><circle r="4"><animateMotion dur="3.6s" begin="-1.2s" repeatCount="indefinite" path="M-28,0a28,10.5 0 1,0 56,0a28,10.5 0 1,0 -56,0"/></circle></g>
    <g transform="rotate(120)"><circle r="4"><animateMotion dur="4.4s" begin="-2.9s" repeatCount="indefinite" path="M-28,0a28,10.5 0 1,0 56,0a28,10.5 0 1,0 -56,0"/></circle></g>
  </g>
</svg>
